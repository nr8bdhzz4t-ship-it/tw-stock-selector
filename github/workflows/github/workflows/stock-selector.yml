name: 台股多因子選股 v2.5

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  stock-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 檢出代碼
        uses: actions/checkout@v4
      
      - name: 🐍 設置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🎯 運行選股腳本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tw_stock_selector_v2.5.py
      
      - name: 📊 上傳結果
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: stock-selector-results
          path: |
            snapshots/
            cache/
          retention-days: 30
      
      - name: 🔄 提交快取
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add snapshots/ 2>/dev/null || true
          git commit -m "🤖 自動更新 $(date -u '+%Y-%m-%d')" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
